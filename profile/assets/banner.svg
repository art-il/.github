<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="ART — Custom Software &amp; AI Solutions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0820"/>
      <stop offset="55%" stop-color="#1a1145"/>
      <stop offset="100%" stop-color="#2a0f4f"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <circle cx="980" cy="70" r="260" fill="url(#glowA)">
      <animate attributeName="cx" values="980;900;980" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="300" r="220" fill="url(#glowB)">
      <animate attributeName="cy" values="300;250;300" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- network motif -->
    <g stroke="#c4b5fd" stroke-opacity="0.35" stroke-width="1.2" fill="none">
      <path d="M860 90 L960 150 L1060 110 L1120 200 L990 240 L960 150"/>
      <path d="M990 240 L900 220 L860 90"/>
    </g>
    <g fill="#e9d5ff">
      <circle cx="860" cy="90" r="4"><animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="150" r="5"><animate attributeName="r" values="5;7.5;5" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="110" r="4"><animate attributeName="r" values="4;6;4" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="200" r="3.5"/>
      <circle cx="990" cy="240" r="4.5"><animate attributeName="r" values="4.5;6.5;4.5" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="220" r="3"/>
    </g>

    <text x="80" y="160" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="10" fill="url(#text)">ART</text>
    <text x="84" y="210" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#e5e7eb">Custom Software &amp; AI Solutions</text>
    <text x="84" y="250" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="17" fill="#a5b4fc" fill-opacity="0.85">
      &gt; idea → product → production
      <tspan fill="#f0abfc">▍<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan>
    </text>
    <text x="84" y="288" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#9ca3af">BUILT IN ISRAEL</text>
  </g>
</svg>
